[project]
name = "wangpan-manager"
version = "2.0.0"
description = "网盘管理：V1 的界面/网盘管理/AI + V2 的自研 libav 播放内核（含弹幕与 TMDB 刮削）"
requires-python = ">=3.11"
# 真实的第三方依赖（AST 扫描得出，清单与理由见 requirements.txt）
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "pyahocorasick>=2.0",
    "pypinyin>=0.53",
    "qrcode>=7.4",
    "pillow>=10.0",
    "oss2>=2.18",
    "websocket-client>=1.7",
]
# libav*（FFmpeg 运行库）走 ctypes 直连，不是 Python 包依赖
# faster-whisper / ctranslate2 故意不在这个环境里（见 requirements.txt）

[tool.setuptools]
# 这是个**脚本式运行**的项目：入口是仓库根的 启动.py（不经 pip 安装），
# 所以不需要 console_scripts / py-modules。
py-modules = []

[tool.setuptools.packages.find]
include = ["wangpan*", "v8_3*"]
# 适配器是**独立的小项目**（各自的 核心/界面 包，靠 sys.path 注入运行），
# 不参与本包安装；运行环境/ 同理（它是打包进绿色版的运行时）。
exclude = ["tests*", "工具*", "适配器*", "运行环境*"]
