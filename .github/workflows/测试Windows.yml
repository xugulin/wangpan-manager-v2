name: 测试（Windows 真机）

# 为什么要有它：V2 的硬解在 Windows 上走 D3D11VA，而开发机是 Linux ——
# 只有真 Windows runner 才能证明"能解码、能出画面、失败会回退软解"。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 装依赖（PySide6）/ 建自带运行环境
        shell: pwsh
        run: |
          python -m venv 运行环境/venv
          运行环境\venv\Scripts\python.exe -m pip install --upgrade pip
          运行环境\venv\Scripts\python.exe -m pip install PySide6
          运行环境\venv\Scripts\python.exe -c "import PySide6; print('PySide6', PySide6.__version__)"

      - name: 下载 Windows 版 FFmpeg 运行库（libav* 的 DLL）
        shell: pwsh
        run: |
          # V2 自己 dlopen libav*，所以只要 DLL 齐就行（不需要 ffmpeg.exe）
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build-shared.zip'
          Invoke-WebRequest -Uri $url -OutFile ff.zip -TimeoutSec 900
          Expand-Archive ff.zip -DestinationPath ffx -Force
          New-Item -ItemType Directory -Force 运行环境\libav | Out-Null
          $bin = Get-ChildItem ffx -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)\av*.dll","$($bin.FullName)\sw*.dll" 运行环境\libav\ -Force
          Get-ChildItem 运行环境\libav | Select-Object Name, Length | Format-Table

      - name: 版本与自检（绑定能不能加载、ABI 对不对）
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          # ⚠️ 不要用 python -c "…中文…"：Windows 控制台是 cp936，
          #    命令行里带中文会直接 UnicodeEncodeError（真机 CI 踩过）。跑 UTF-8 文件。
          运行环境\venv\Scripts\python.exe 工具\自检.py

      - name: 单元测试（离屏 Qt）
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          运行环境\venv\Scripts\python.exe -m unittest discover -s tests -t . -v

      - name: 真机播放测试（出画面 / 硬解或回退 / 截图 / 网络 Range）
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          # 这段是"用户视角"的验收：真解码、真出帧、真存图、真走一遍 HTTP。
          运行环境\venv\Scripts\python.exe 工具\windows真机验收.py

      - name: 播放诊断（只出几帧时用来看卡在哪一环）
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          运行环境\venv\Scripts\python.exe 工具\诊断播放.py
          if ($LASTEXITCODE -ne 0) { Write-Host "（诊断显示出画面不足，继续打印日志）" }

      - name: 打印日志
        if: always()
        shell: pwsh
        run: |
          foreach ($f in @('数据\真机验收.txt', '数据\诊断播放.txt')) {
            if (Test-Path $f) { Write-Host "==== $f ===="; Get-Content $f -Encoding UTF8 }
          }
