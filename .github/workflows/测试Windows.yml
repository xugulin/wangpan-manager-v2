name: 测试（Windows 真机）

# 为什么要有它：V2 的硬解在 Windows 上走 D3D11VA，而开发机是 Linux ——
# 只有真 Windows runner 才能证明"能解码、能出画面、失败会回退软解"。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 装依赖（requirements.txt）/ 建自带运行环境
        shell: pwsh
        env:
          # ⚠️ 这一步必须显式设 UTF-8：Windows 控制台默认 cp936，而 venv 路径里有中文
          #    （运行环境\venv），pip 打印任何带中文的内容都可能在 rich 的 emit 阶段
          #    UnicodeEncodeError —— 报错栈看起来在 pip/_vendor/rich/console.py 里，
          #    跟"装依赖"八竿子打不着，排查很费劲（CI 真机日志实测）。
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          # ⚠️ 不能只装 PySide6：整合之后这个仓库里有 V1 那一层
          #    （v8_3/：界面 / 三家网盘适配器桥 / AI），它要 httpx、pyahocorasick、
          #    pypinyin、qrcode、oss2、websocket-client …… 只装 PySide6 的话
          #    V1 那 449 条测试会在 import 阶段就全红。
          # ⚠️ 这里也**不要**写 `python -c "…中文…"`（同一条坑，见上面的 env 注释）。
          python -m venv 运行环境/venv
          运行环境\venv\Scripts\python.exe -m pip install --upgrade pip
          运行环境\venv\Scripts\python.exe -m pip install -r requirements.txt
          运行环境\venv\Scripts\python.exe -c "import PySide6, httpx, ahocorasick, pypinyin, qrcode; print('deps ok:', PySide6.__version__, '| httpx', httpx.__version__)"

      - name: 下载 Windows 版 FFmpeg 运行库（libav* 的 DLL）
        shell: pwsh
        run: |
          # V2 自己 dlopen libav*，所以只要 DLL 齐就行（不需要 ffmpeg.exe）。
          # ⚠️ 必须选 **avcodec 63** 的构建：偏移表是按 63 的头文件生成的，
          #    拿 61 的 DLL 去配 63 的表会读出垃圾（真机 CI 上踩过：
          #    帧时间戳变成 671088 秒 → 只出 1 帧）。BtbN 的 master 构建就是 63。
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip'
          Invoke-WebRequest -Uri $url -OutFile ff.zip -TimeoutSec 900
          Expand-Archive ff.zip -DestinationPath ffx -Force
          New-Item -ItemType Directory -Force 运行环境\libav | Out-Null
          $bin = Get-ChildItem ffx -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)\av*.dll","$($bin.FullName)\sw*.dll" 运行环境\libav\ -Force
          Get-ChildItem 运行环境\libav | Select-Object Name, Length | Format-Table

      - name: 版本与自检（绑定能不能加载、ABI 对不对）
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          # ⚠️ 不要用 python -c "…中文…"：Windows 控制台是 cp936，
          #    命令行里带中文会直接 UnicodeEncodeError（真机 CI 踩过）。跑 UTF-8 文件。
          运行环境\venv\Scripts\python.exe 工具\自检.py

      - name: 整合入口能起来（命令行模式，顺带验证 V1 界面层与三家适配器在 Windows 上可导入）
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          # 这几条不播视频，只看"合并后的入口与两套血脉能不能加载"：
          #   启动.py --cli 会走 配置 → 网盘实例列表 → 适配器目录校验 这一整条 V1 链路。
          运行环境\venv\Scripts\python.exe 启动.py --cli 网盘列表
          if ($LASTEXITCODE -ne 0) { throw "整合入口的 CLI 模式没起来（退出码 $LASTEXITCODE）" }

      - name: 单元测试（离屏 Qt）
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          运行环境\venv\Scripts\python.exe -m unittest discover -s tests -t . -v

      - name: 界面验收（合并后的 GUI 逐页截图 + 真播像素校验）
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          # 这是"用户视角"里最像人工点一遍的那条：把**合并后的主窗口**真的建起来
          # （V1 的界面层 + 假网盘，免登录），8 个页面逐页切过去各抓一张图，
          # 再用**自研内核**真播一段素材，并对画面做像素校验（黑屏会是 0 亮/1 色）。
          # 同一个脚本在 Linux 与本机 wine 里也跑（见 工具/wine验证.py）。
          运行环境\venv\Scripts\python.exe 工具\界面验收.py
          if ($LASTEXITCODE -ne 0) { throw "界面验收没通过（退出码 $LASTEXITCODE）" }

      - name: 真机播放测试（出画面 / 硬解或回退 / 截图 / 网络 Range）
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          # 这段是"用户视角"的验收：真解码、真出帧、真存图、真走一遍 HTTP。
          运行环境\venv\Scripts\python.exe 工具\windows真机验收.py

      - name: 播放诊断（只出几帧时用来看卡在哪一环）
        if: always()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          运行环境\venv\Scripts\python.exe 工具\诊断播放.py
          if ($LASTEXITCODE -ne 0) { Write-Host "（诊断显示出画面不足，继续打印日志）" }

      - name: 打印日志
        if: always()
        shell: pwsh
        run: |
          foreach ($f in @('数据\界面验收.txt', '数据\真机验收.txt', '数据\诊断播放.txt')) {
            if (Test-Path $f) { Write-Host "==== $f ===="; Get-Content $f -Encoding UTF8 }
          }

      - name: 收走截图与报告（构建产物，事后能直接看）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-界面验收-截图与报告
          # 截图是"界面真的画出来了"的直接证据；报告是结构化结果（含像素校验数字）。
          path: |
            数据/界面验收/*.png
            数据/界面验收.txt
            数据/真机验收.txt
            数据/真机验收/*.png
            数据/诊断播放.txt
          if-no-files-found: warn

